name: Scrape latest data

on:
  push:
  # workflow_dispatch:
  # schedule:
  #   - cron:  '0 14 * * *'

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: 3.8
    - uses: actions/cache@v3
      name: Configure pip caching
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install Python dependencies
      run: |-
        pip install -r requirements.txt
    - name: Fetch latest postings
      run: |-
        cp Beach_Status_List.csv Beach_Status_List-old.csv
        python process_v2/scrape_postings.py --output Beach_Status_List.csv
        # Generate commit message using csv-diff
        csv-diff Beach_Status_List-old.csv Beach_Status_List.csv --key=Beach > message.txt
    - name: Commit and push if it changed
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add Beach_Status_List.csv process_v2/outputs/
        timestamp=$(date -u)
        git commit -F message.txt || exit 0
        git push
